<svg
  viewBox="0 0 800 120"
  width="100%"
  height="120"
  xmlns="http://www.w3.org/2000/svg"
  shape-rendering="crispEdges"
>
  <!-- Transparent background -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Pixel-style text -->
  <text
    x="800"
    y="70"
    font-size="48"
    fill="#00FF9C"
    font-family="monospace"
    letter-spacing="4"
  >
    WELCOME
    <!-- Marquee animation -->
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="-1000 0"
      dur="6s"
      repeatCount="indefinite"
    />
  </text>
</svg>
