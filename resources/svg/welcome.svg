<svg
  viewBox="0 0 600 120"
  width="100%"
  height="120"
  xmlns="http://www.w3.org/2000/svg"
>
  <rect width="100%" height="100%" fill="none" />

  <!-- Text Path -->
  <text
    x="50%"
    y="50%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-size="56"
    font-family="Arial, Helvetica, sans-serif"
    fill="none"
    stroke="white"
    stroke-width="2"
    stroke-dasharray="420"
    stroke-dashoffset="420"
  >
    Welcome
    <!-- Typing animation -->
    <animate
      attributeName="stroke-dashoffset"
      from="420"
      to="0"
      dur="1.8s"
      fill="freeze"
    />
   <animate
  attributeName="stroke-dashoffset"
  values="420;0;420"
  dur="3s"
  repeatCount="indefinite"
/>

  </text>
</svg>
