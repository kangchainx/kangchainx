<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 120"
  width="600"
  height="120"
>
  <rect width="600" height="120" fill="none" />

  <!-- Settings -->
  <!-- 每个字母延迟 0.4s，总时长约 4s -->

  <g
    transform="translate(140 75)"
    font-family="monospace"
    font-size="56"
    fill="#00FF9C"
  >
    <!-- W -->
    <text x="0" visibility="hidden">W
      <set attributeName="visibility" to="visible" begin="0s" dur="0.001s" />
    </text>

    <!-- E -->
    <text x="40" visibility="hidden">E
      <set attributeName="visibility" to="visible" begin="0.4s" dur="0.001s" />
    </text>

    <!-- L -->
    <text x="80" visibility="hidden">L
      <set attributeName="visibility" to="visible" begin="0.8s" dur="0.001s" />
    </text>

    <!-- C -->
    <text x="120" visibility="hidden">C
      <set attributeName="visibility" to="visible" begin="1.2s" dur="0.001s" />
    </text>

    <!-- O -->
    <text x="160" visibility="hidden">O
      <set attributeName="visibility" to="visible" begin="1.6s" dur="0.001s" />
    </text>

    <!-- M -->
    <text x="200" visibility="hidden">M
      <set attributeName="visibility" to="visible" begin="2.0s" dur="0.001s" />
    </text>

    <!-- E -->
    <text x="240" visibility="hidden">E
      <set attributeName="visibility" to="visible" begin="2.4s" dur="0.001s" />
    </text>

    <!-- Cursor -->
    <text x="280">_
      <animate
        attributeName="opacity"
        values="1;0;1"
        dur="1s"
        repeatCount="indefinite"
      />
    </text>

    <!-- 全局重置：4s 后全部隐藏，再重新开始 -->
    <set attributeName="visibility" to="hidden" begin="4s" />
    <set attributeName="visibility" to="visible" begin="4.01s" />
  </g>
</svg>
