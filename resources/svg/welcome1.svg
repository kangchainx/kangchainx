<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 120"
  width="600"
  height="120"
  shape-rendering="crispEdges"
>
  <!-- Transparent background -->
  <rect x="0" y="0" width="600" height="120" fill="none" />

  <!-- Terminal text group -->
  <g
    transform="translate(120 70)"
    font-family="monospace"
    font-size="56"
    fill="#00FF9C"
  >
    <!-- W -->
    <text x="0">W
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="0s" fill="freeze"/>
    </text>

    <!-- E -->
    <text x="40">E
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="0.3s" fill="freeze"/>
    </text>

    <!-- L -->
    <text x="80">L
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="0.6s" fill="freeze"/>
    </text>

    <!-- C -->
    <text x="120">C
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="0.9s" fill="freeze"/>
    </text>

    <!-- O -->
    <text x="160">O
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="1.2s" fill="freeze"/>
    </text>

    <!-- M -->
    <text x="200">M
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="1.5s" fill="freeze"/>
    </text>

    <!-- E -->
    <text x="240">E
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="1.8s" fill="freeze"/>
    </text>

    <!-- Cursor -->
    <text x="280">_
      <animate attributeName="opacity"
        values="1;0;1"
        dur="1s"
        repeatCount="indefinite"
      />
    </text>

    <!-- Reset (loop) -->
    <animate
      attributeName="opacity"
      from="1"
      to="0"
      begin="4s"
      dur="0.01s"
      fill="freeze"
    />
    <animate
      attributeName="opacity"
      from="0"
      to="1"
      begin="4.01s"
      dur="0.01s"
      fill="freeze"
    />
  </g>
</svg>
